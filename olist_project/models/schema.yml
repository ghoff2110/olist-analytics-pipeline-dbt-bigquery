version: 2
 
sources:
  - name: olist
    database: root-micron-435213-v0
    schema: olist
    tables:
      - name: olist_orders
      - name: olist_payments
      - name: olist_sellers
      - name: olist_products
      - name: olist_order_items
      - name: olist_customers
 
models:
  - name: stg_orders
    description: "Cleaned orders table"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
 
  - name: stg_payments
    description: "Cleaned payments table"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: payment_type
        tests:
          - not_null
          - accepted_values:
             values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']
      - name: payment_value
        tests:
          - not_null
 
  - name: stg_customers
    description: "Cleaned customers table"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
 
  - name: stg_order_items
    description: "Cleaned order items table"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: seller_id
        tests:
          - not_null
 
  - name: stg_products
    description: "Cleaned products table"
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
 
  - name: stg_sellers
    description: "Cleaned sellers table"
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null
 
  - name: fct_orders
    description: "One row per order with revenue, delivery info and delay flag"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: total_amount
        tests:
          - not_null
 
  - name: mart_revenue_daily
    description: "Daily revenue aggregated by state"
    columns:
      - name: order_date
        tests:
          - not_null
      - name: revenue
        tests:
          - not_null
 
  - name: mart_seller_performance
    description: "Seller performance metrics including revenue and delay rate"
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null
 